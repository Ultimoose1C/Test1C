<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E99A6"/>
      <stop offset="0.45" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#9AA5B1"/>
    </linearGradient>
    <linearGradient id="steelHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="0.55" stop-color="#B9C3CD"/>
      <stop offset="1" stop-color="#7D8895"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B3261E"/>
      <stop offset="0.45" stop-color="#F0503C"/>
      <stop offset="1" stop-color="#A21F18"/>
    </linearGradient>
  </defs>

  <!-- Цикл: две круговые стрелки -->
  <g fill="none" stroke-linecap="round">
    <path d="M8.44 21.01 A26 26 0 0 1 56.11 22.26" stroke="#B85400" stroke-width="7.0"/>
    <path d="M55.56 42.99 A26 26 0 0 1 7.89 41.74" stroke="#B85400" stroke-width="7.0"/>
    <path d="M8.44 21.01 A26 26 0 0 1 56.11 22.26" stroke="url(#ring)" stroke-width="5.4"/>
    <path d="M55.56 42.99 A26 26 0 0 1 7.89 41.74" stroke="url(#ring)" stroke-width="5.4"/>
  </g>
  <g fill="url(#ring)" stroke="#B85400" stroke-width="0.8" stroke-linejoin="round">
    <path d="M61.30 20.16 Q60.18 27.64 57.98 32.91 Q55.20 28.41 50.91 24.36 Z"/>
    <path d="M2.70 43.84 Q3.82 36.36 6.02 31.09 Q8.80 35.59 13.09 39.64 Z"/>
  </g>

  <g transform="translate(32 32) scale(0.85)" stroke="#1F2A36" stroke-width="1.3" stroke-linejoin="round">
    <!-- Ключ: головка сверху справа, рукоять вниз влево -->
    <g transform="rotate(45)">
      <rect x="-2.6" y="-9" width="5.2" height="27" rx="2.6" fill="url(#steel)"/>
      <path fill="url(#steelHead)" fill-rule="evenodd"
        d="M-2.4 -21.71 A7.6 7.6 0 1 0 2.4 -21.71 L2.4 -16.5 A2.4 2.4 0 0 1 -2.4 -16.5 Z" transform="rotate(-18 0 -14.5)"/>
      <circle cx="0" cy="14.6" r="1.25" fill="#1F2A36" stroke="none"/>
    </g>
    <!-- Молоток: боёк сверху слева, рукоять вниз вправо -->
    <g transform="rotate(-45)">
      <rect x="-2.5" y="-12" width="5" height="16" fill="url(#steel)"/>
      <rect x="-3.1" y="3" width="6.2" height="15.5" rx="3.1" fill="url(#grip)"/>
      <path fill="url(#steelHead)"
        d="M-10.5 -19.5 L-7.5 -19.5 L-7.5 -20.5 L3.5 -20.5
           C8 -20.5 11.5 -17.5 12.6 -12.6
           C10.6 -14.8 8 -15.6 3.5 -15.4
           L3.5 -11 L-7.5 -11 L-7.5 -12 L-10.5 -12 Z"/>
    </g>
  </g>
</svg>
