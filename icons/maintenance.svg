<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E99A6"/>
      <stop offset="0.45" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#9AA5B1"/>
    </linearGradient>
    <linearGradient id="steelHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="0.55" stop-color="#B9C3CD"/>
      <stop offset="1" stop-color="#7D8895"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B3261E"/>
      <stop offset="0.45" stop-color="#F0503C"/>
      <stop offset="1" stop-color="#A21F18"/>
    </linearGradient>
  </defs>

  <!-- Цикл: две круговые стрелки -->
  <g fill="none" stroke-linecap="round">
    <path d="M8.12 19.83 A26.8 26.8 0 0 1 56.85 21.96" stroke="#B85400" stroke-width="6.0"/>
    <path d="M55.88 44.17 A26.8 26.8 0 0 1 7.15 42.04" stroke="#B85400" stroke-width="6.0"/>
    <path d="M8.12 19.83 A26.8 26.8 0 0 1 56.85 21.96" stroke="url(#ring)" stroke-width="4.6"/>
    <path d="M55.88 44.17 A26.8 26.8 0 0 1 7.15 42.04" stroke="url(#ring)" stroke-width="4.6"/>
  </g>
  <g fill="url(#ring)" stroke="#B85400" stroke-width="0.7" stroke-linejoin="round">
    <path d="M61.30 20.16 Q60.53 27.02 58.80 32.00 Q56.27 27.76 52.40 23.76 Z"/>
    <path d="M2.70 43.84 Q3.47 36.98 5.20 32.00 Q7.73 36.24 11.60 40.24 Z"/>
  </g>

  <!-- Скрещённые молоток и ключ -->
  <g transform="translate(33.38 34.94) scale(0.93)" stroke="#1F2A36" stroke-width="1.3" stroke-linejoin="round">
    <!-- Ключ: головка сверху справа -->
    <g transform="rotate(45)">
      <rect x="-2.6" y="-9" width="5.2" height="26.5" rx="2.6" fill="url(#steel)"/>
      <path fill="url(#steelHead)" transform="rotate(-18 0 -14)"
        d="M-2.5 -21.79 A8.2 8.2 0 1 0 2.5 -21.79 L2.5 -16.5 A2.5 2.5 0 0 1 -2.5 -16.5 Z"/>
      <circle cx="0" cy="14.2" r="1.25" fill="#1F2A36" stroke="none"/>
    </g>
    <!-- Молоток: боёк сверху слева -->
    <g transform="rotate(-45)">
      <rect x="-2.5" y="-12" width="5" height="16" fill="url(#steel)"/>
      <rect x="-3.1" y="3" width="6.2" height="14.5" rx="3.1" fill="url(#grip)"/>
      <path fill="url(#steelHead)"
        d="M-10 -19.5 L-7 -19.5 L-7 -20.5 L3.5 -20.5
           C8 -20.5 11.2 -17.5 12.2 -12.8
           C10.2 -14.8 8 -15.6 3.5 -15.4
           L3.5 -11 L-7 -11 L-7 -12 L-10 -12 Z"/>
    </g>
  </g>
</svg>
