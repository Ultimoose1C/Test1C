<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#F26A00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2DB"/>
    </linearGradient>
  </defs>
  <!-- Цикл -->
  <g fill="none" stroke="url(#ring)" stroke-width="1.0" stroke-linecap="round">
    <path d="M9.03 11.52 A2.05 2.05 0 1 1 6.07 12.60"/>
  </g>
  <g fill="url(#ring)">
    <path d="M4.99 12.21 L8.00 11.25 L7.15 12.99 Z"/>
  </g>
  <!-- Скрещённые молоток и ключ -->
  <g transform="translate(8.70 6.80) scale(1.1)" stroke="#26313C" stroke-width="0.273" stroke-linejoin="round">
    <!-- Ключ: головка сверху справа -->
    <g transform="rotate(45)">
      <rect x="-0.85" y="-2.2" width="1.7" height="6.9" rx="0.85" fill="url(#steel)"/>
      <path fill="url(#steel)" transform="rotate(-15 0 -3.4)"
        d="M-0.6 -5.52 A2.2 2.2 0 1 0 0.6 -5.52 L0.6 -4.1 A0.6 0.6 0 0 1 -0.6 -4.1 Z"/>
    </g>
    <!-- Молоток: боёк сверху слева -->
    <g transform="rotate(-45)">
      <rect x="-0.75" y="-3.6" width="1.5" height="5" fill="url(#steel)"/>
      <rect x="-0.95" y="0.6" width="1.9" height="4.2" rx="0.95" fill="#E53935"/>
      <path fill="url(#steel)"
        d="M-2.9 -5.4 H1.5 Q3.6 -5.4 4.1 -2.9 Q3.1 -3.7 1.5 -3.6 V-3.2 H-2.9 Z"/>
    </g>
  </g>
</svg>
